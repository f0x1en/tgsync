name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - name: simulation (2000 seeds)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release -q -p tgsync-sim -- --seeds 2000

  wasm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --profile wasm -p tgsync-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/wasm/tgsync_wasm.wasm
      - run: wasm-bindgen --target web --out-dir pkg-web target/wasm32-unknown-unknown/wasm/tgsync_wasm.wasm
      - run: ls -l pkg pkg-web
      - run: node tgsync-wasm/tests/smoke.mjs "$PWD/pkg/tgsync_wasm.js"
      - uses: actions/upload-artifact@v4
        with:
          name: tgsync-wasm
          path: |
            core/pkg
            core/pkg-web

  ts:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tgsync-wasm, path: core }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: ts
      - run: npm run typecheck && npm test
        working-directory: ts
      - name: sandbox tests (two Node CLI processes)
        run: |
          python -m pip install -e ".[dev]"
          TGSYNC_CLI="node $PWD/ts/dist/tgsync.mjs" pytest -q tests/test_sandbox.py

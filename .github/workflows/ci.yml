name: ci
on: [push, pull_request]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo test
      - name: simulation (2000 seeds)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release -q -p tgsync-sim -- --seeds 2000

  wasm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --profile wasm -p tgsync-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/wasm/tgsync_wasm.wasm
      - run: wasm-bindgen --target web --out-dir pkg-web target/wasm32-unknown-unknown/wasm/tgsync_wasm.wasm
      - run: ls -l pkg pkg-web
      - run: node tgsync-wasm/tests/smoke.mjs "$PWD/pkg/tgsync_wasm.js"
      - uses: actions/upload-artifact@v4
        with:
          name: tgsync-wasm
          path: |
            core/pkg
            core/pkg-web

  ts:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tgsync-wasm, path: core }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: ts
      - run: npm run typecheck && npm test
        working-directory: ts
      - uses: actions/upload-artifact@v4
        with:
          name: tgsync-cli
          path: ts/dist/tgsync.mjs
      - name: Obsidian plugin (build + tests against a fake tgsync)
        working-directory: obsidian
        run: npm ci && npm run build && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: tgsync-obsidian
          path: |
            obsidian/main.js
            obsidian/manifest.json
      - name: sandbox tests (two Node CLI processes)
        run: |
          python -m pip install pytest
          pytest -q tests/test_sandbox.py

  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: cargo fmt (the diff is uploaded as fmt.patch)
        run: |
          cargo fmt --all
          git diff > fmt.patch
          [ ! -s fmt.patch ] || { cat fmt.patch | head -50; echo "run cargo fmt (or apply the fmt.patch artifact)"; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fmt-patch, path: core/fmt.patch }
      - run: cargo clippy --all-targets -- -D warnings
      - run: "[ ! -s fmt.patch ]"

name: release
# Push a tag like 0.1.0 (the version in manifest.json): builds the plugin and publishes a GitHub
# release with main.js and manifest.json, which is what BRAT and Obsidian install.
# Releases carry no Telegram API key: each person makes their own (the login screen says how).
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches manifest.json
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Rust core -> WebAssembly
        working-directory: core
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo build --profile wasm -p tgsync-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg-web target/wasm32-unknown-unknown/wasm/tgsync_wasm.wasm
      - run: npm ci && npm run build && npm test
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "tgsync $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

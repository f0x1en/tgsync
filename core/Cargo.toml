[workspace]
resolver = "2"
members = ["tgsync-core", "tgsync-sim", "tgsync-wasm"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

# Crypto in debug builds is very slow; optimize dependencies (our own code stays debug).
[profile.dev.package."*"]
opt-level = 3

# The WebAssembly build: small over fast (`cargo build --profile wasm --target wasm32-unknown-unknown`).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

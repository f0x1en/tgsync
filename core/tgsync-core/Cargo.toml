[package]
name = "tgsync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tgsync engine: crypto, op log and replay. No I/O."

[dependencies]
aes-gcm = "0.10"
age = { version = "0.11", default-features = false }
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

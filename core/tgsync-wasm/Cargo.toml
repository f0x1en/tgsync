[package]
name = "tgsync-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings of tgsync-core for the Node CLI and the Obsidian plugin."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.10"
tgsync-core = { path = "../tgsync-core" }
wasm-bindgen = "=0.2.130"

# Random numbers in the browser / Node come from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
